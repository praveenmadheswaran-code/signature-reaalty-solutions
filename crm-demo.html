<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGNATURE REAALTY SOLUTIONS | Platform Demo</title><style>:root{font-family:Arial,sans-serif;color:#15345a;background:#f4f8ff}*{box-sizing:border-box}body{margin:0}header{background:#123f7a;color:white;padding:22px 5%}header h1{font-size:23px;margin:0}header p{margin:7px 0}nav{display:flex;flex-wrap:wrap;gap:8px;padding:16px 5%;background:white}button{cursor:pointer;border:1px solid #cad8ed;background:white;color:#123f7a;padding:11px 14px;border-radius:9px;font-weight:600}button.active,button.primary{background:#1559a3;color:white}main{max-width:1100px;margin:auto;padding:25px 5%}.panel{background:white;border:1px solid #dce5f3;border-radius:14px;padding:20px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.muted{color:#60748d}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd7e7;border-radius:8px;margin:6px 0 13px}label{display:block;font-weight:bold}.pill{display:inline-block;background:#e8f1fc;padding:5px 9px;border-radius:20px;font-size:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e4eaf2;padding:11px}footer{padding:25px;text-align:center;color:#667}.notice{background:#fff7e6;padding:12px;border-radius:8px}a{color:#1559a3}</style></head><body><header><h1>SIGNATURE REAALTY SOLUTIONS</h1><p>Beyond Land, Towards Legacy</p><small>Coimbatore, Tamil Nadu | Platform Integration Demo</small></header><nav id="nav"></nav><main id="app"></main><footer>Demo only · No real authentication, database, or uploaded documents · Contact: 7904203822</footer><script>
const sections=['Home','Properties','Login','Admin','Manager','Associate','Leads','Deals','Reports'];let page='Home',properties=[{id:'SR-1001',type:'Residential Plot',location:'Sulur, Coimbatore',price:1435000,status:'Published'},{id:'SR-1002',type:'Agricultural Land',location:'Pollachi, Coimbatore',price:8500000,status:'Pending'}],leads=[{id:'LD-001',name:'Sample Buyer',property:'SR-1001',status:'New'}],deals=[{id:'DL-001',property:'SR-1001',amount:1500000,rate:2,share:60}];const money=n=>'₹'+Number(n).toLocaleString('en-IN');const app=document.getElementById('app');function card(s){return '<div class="panel">'+s+'</div>'}function render(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${s===page?'active':''}" onclick="page='${s}';render()">${s}</button>`).join('');let h='';if(page==='Home')h=card('<h2>Find Your Next Property</h2><p>Premium property sourcing and buyer support across Tamil Nadu.</p><button class="primary" onclick="page=\'Properties\';render()">Explore Properties</button>')+card('<h3>Platform modules</h3><p>Public listings · Role-based CRM (planned) · Manager approval · Leads · Deals · Reports</p>');if(page==='Properties')h=card('<h2>Published Properties</h2><p class="muted">Only approved and published properties appear here.</p>')+properties.filter(p=>p.status==='Published').map(p=>card(`<span class="pill">${p.id}</span><h3>${p.type}</h3><p>${p.location} · ${money(p.price)}</p><a target="_blank" rel="noopener" href="https://wa.me/917904203822?text=${encodeURIComponent('Hello, I am interested in '+p.id)}">WhatsApp Enquiry</a>`)).join('');if(page==='Login')h=card('<h2>Login Preview</h2><p class="notice">UI preview only: no credentials are collected or verified here.</p><label>Mobile / User ID</label><input disabled placeholder="Connect authentication backend first"><label>Password</label><input disabled type="password" placeholder="Authentication not yet enabled">');if(page==='Admin')h=card('<h2>Admin Dashboard</h2><div class="cards">'+[['Properties',properties.length],['Leads',leads.length],['Deals',deals.length],['Commission',money(deals.reduce((s,d)=>s+d.amount*d.rate/100,0))]].map(x=>card(`<b>${x[0]}</b><h2>${x[1]}</h2>`)).join('')+'</div><p class="muted">Role permissions will be enforced by the backend, not by these navigation tabs.</p>');if(page==='Manager')h=card('<h2>Manager Approval</h2><p class="muted">Demo only. Approval and publishing are separate actions.</p>')+properties.filter(p=>p.status!=='Published').map(p=>card(`<h3>${p.id} – ${p.type}</h3><p>${p.location}</p><span class="pill">${p.status}</span><p><button onclick="updateProperty('${p.id}','Approved')">Approve</button> <button onclick="updateProperty('${p.id}','Rejected')">Reject</button> <button onclick="updateProperty('${p.id}','Published')">Publish (demo)</button></p>`)).join('');if(page==='Associate')h=card('<h2>Business Associate · Add Property</h2><form onsubmit="addProperty(event)"><label>Property Type</label><select name="type"><option>Residential Plot</option><option>Agricultural Land</option><option>Farm Land</option><option>Commercial Property</option><option>Industrial Land</option></select><label>Location</label><input name="location" required maxlength="100"><label>Expected Price (₹)</label><input name="price" type="number" min="1" required><button class="primary">Submit for Approval</button></form>')+card('<h3>Property statuses</h3>'+properties.map(p=>`<p>${p.id} · ${p.location} · ${p.status}</p>`).join(''));if(page==='Leads')h=card('<h2>Buyer Enquiries</h2><form onsubmit="addLead(event)"><label>Buyer Name</label><input name="name" maxlength="80" required><label>Property ID</label><select name="property">'+properties.map(p=>`<option>${p.id}</option>`).join('')+'</select><button class="primary">Add Sample Lead</button></form>')+card(leads.map(l=>`<p>${l.id} · ${l.name} · ${l.property} · ${l.status}</p>`).join(''));if(page==='Deals')h=card('<h2>Property-wise Commission</h2><form onsubmit="addDeal(event)"><label>Property</label><select name="property">'+properties.map(p=>`<option>${p.id}</option>`).join('')+'</select><label>Deal Value (₹)</label><input name="amount" type="number" min="1" required><label>Commission %</label><input name="rate" type="number" min="0" max="100" step="0.01" required><label>Associate Share %</label><input name="share" type="number" min="0" max="100" step="0.01" required><button class="primary">Add Sample Deal</button></form>')+deals.map(d=>card(`<b>${d.id} · ${d.property}</b><p>Commission: ${money(d.amount*d.rate/100)} (${d.rate}%)</p><p>Associate: ${money(d.amount*d.rate*d.share/10000)} · Company: ${money(d.amount*d.rate*(100-d.share)/10000)}</p>`)).join('');if(page==='Reports')h=card('<h2>Reports · Custom Date Filter</h2><label>From Date</label><input id="from" type="date"><label>To Date</label><input id="to" type="date"><button class="primary" onclick="showReport()">View Report</button><div id="reportResult" class="muted" style="margin-top:15px">Date-filtered reports require timestamped database records. Current counts are demo-only.</div>')+card(`<p>Demo totals: ${properties.length} Properties · ${leads.length} Leads · ${deals.length} Deals</p>`);app.innerHTML=h}function updateProperty(id,status){let p=properties.find(x=>x.id===id);if(!p)return;if(status==='Published'&&p.status!=='Approved'){alert('Approve property before publishing.');return}p.status=status;render()}function addProperty(e){e.preventDefault();let f=new FormData(e.target);properties.push({id:'SR-'+String(1000+properties.length+1),type:f.get('type'),location:f.get('location'),price:Number(f.get('price')),status:'Pending'});render()}function addLead(e){e.preventDefault();let f=new FormData(e.target);leads.push({id:'LD-'+String(leads.length+1).padStart(3,'0'),name:f.get('name'),property:f.get('property'),status:'New'});render()}function addDeal(e){e.preventDefault();let f=new FormData(e.target);deals.push({id:'DL-'+String(deals.length+1).padStart(3,'0'),property:f.get('property'),amount:Number(f.get('amount')),rate:Number(f.get('rate')),share:Number(f.get('share'))});render()}function showReport(){let a=document.getElementById('from').value,b=document.getElementById('to').value;document.getElementById('reportResult').textContent=(!a||!b||a>b)?'Please select a valid From and To date.':'Selected: '+a+' to '+b+'. Date-filtered records will be available after database integration.'}render();</script></body></html>
